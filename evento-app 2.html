<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVENTO — Společně tvoříme víc.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1E0B3D; --royal:#6D28D9; --electric:#9333EA; --medium:#A855F7;
    --sky:#DAB6FF; --ice:#FFFFFF; --white:#FFFFFF; --slate:#6B5C7D; --ink:#140A20;
    --line:rgba(10,27,61,0.12); --danger:#C0392B;
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif;
  }
  :root:not([data-theme="light"]){ --navy:#1E0B3D; --royal:#6D28D9; --electric:#9333EA; --medium:#A855F7; --sky:#DAB6FF; --ice:#FFFFFF; --white:#FFFFFF; --slate:#6B5C7D; --ink:#140A20; --line:rgba(10,27,61,0.12); }
  :root[data-theme="dark"]{ --navy:#1E0B3D; --royal:#6D28D9; --electric:#9333EA; --medium:#A855F7; --sky:#DAB6FF; --ice:#FFFFFF; --white:#FFFFFF; --slate:#6B5C7D; --ink:#140A20; --line:rgba(10,27,61,0.12); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --navy:#1E0B3D; --royal:#6D28D9; --electric:#9333EA; --medium:#A855F7; --sky:#DAB6FF; --ice:#FFFFFF; --white:#FFFFFF; --slate:#6B5C7D; --ink:#140A20; --line:rgba(10,27,61,0.12); } }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--white);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  img,svg{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;cursor:pointer;}
  button{font-family:var(--font-body);cursor:pointer;}
  .wrap{max-width:1200px;margin:0 auto;padding:0 28px;}
  section{padding:110px 0;}
  section + section{border-top:1px solid var(--line);}
  h1,h2,h3{font-family:var(--font-display);margin:0;color:var(--navy);}
  p{line-height:1.65;color:var(--slate);margin:0;}
  .eyebrow{font-weight:600;font-size:0.8rem;color:var(--royal);margin:0 0 14px;letter-spacing:0.01em;}
  .section-head{max-width:640px;margin-bottom:52px;}
  .section-head h2{font-size:clamp(2rem,3.4vw,2.8rem);letter-spacing:-0.01em;line-height:1.1;margin-bottom:16px;}
  .section-head p{font-size:1.05rem;}
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease, transform .6s ease;}
  .reveal.in{opacity:1;transform:none;}

  /* NAV */
  header.site-nav{position:sticky;top:0;z-index:80;background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  header.site-nav .wrap{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;gap:20px;}
  .logo-lockup{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:1.15rem;color:var(--navy);}
  .logo-lockup svg{width:26px;height:26px;}
  .nav-links{display:flex;align-items:center;gap:30px;}
  .nav-links a{font-size:0.88rem;font-weight:500;color:var(--navy);}
  .nav-links a.active{color:var(--royal);}
  .nav-links a:hover{color:var(--royal);}
  .nav-right{display:flex;align-items:center;gap:14px;}
  .nav-cta{font-size:0.85rem;font-weight:600;color:var(--white)!important;background:var(--royal);padding:10px 20px;border-radius:30px;}
  .nav-cta:hover{background:var(--electric);}
  .nav-ig{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--navy);}
  .nav-ig svg{width:16px;height:16px;}
  .nav-toggle{display:none;background:none;border:none;padding:6px;}
  .nav-toggle span{display:block;width:22px;height:2px;background:var(--navy);margin:5px 0;}
  .mobile-menu{display:none;flex-direction:column;gap:2px;padding:10px 28px 20px;border-top:1px solid var(--line);background:var(--white);}
  .mobile-menu a{padding:12px 0;font-size:0.95rem;font-weight:500;color:var(--navy);border-bottom:1px solid var(--line);}
  .mobile-menu.open{display:flex;}
  @media(max-width:860px){ .nav-links{display:none;} .nav-toggle{display:block;} }

  /* BUTTONS */
  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:0.92rem;padding:15px 28px;border-radius:30px;border:none;}
  .btn-primary{background:var(--navy);color:var(--white);}
  .btn-primary:hover{background:var(--royal);}
  .btn-light{background:var(--white);color:var(--navy);}
  .btn-outline{background:transparent;color:var(--navy);border:1px solid var(--line);}
  .btn-outline:hover{border-color:var(--royal);color:var(--royal);}
  .btn-sm{padding:9px 16px;font-size:0.8rem;border-radius:20px;}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(192,57,43,0.3);}
  .btn-danger:hover{background:rgba(192,57,43,0.08);}
  .link-btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:0.92rem;color:var(--royal);border-bottom:1px solid var(--royal);padding-bottom:2px;}

  /* HERO (home) */
  .hero{background:var(--navy);color:var(--white);padding:180px 0 130px;position:relative;overflow:hidden;}
  .hero .wrap{position:relative;z-index:2;}
  .hero-bg{position:absolute;inset:0;z-index:1;opacity:0.55;}
  .hero-kicker{color:var(--sky);font-weight:600;font-size:0.85rem;letter-spacing:0.03em;margin-bottom:24px;text-transform:uppercase;}
  .hero h1{color:var(--white);font-size:clamp(2.8rem,7vw,5.4rem);line-height:0.98;letter-spacing:-0.02em;font-weight:700;max-width:900px;}
  .hero-claim{font-family:var(--font-display);font-weight:600;font-size:clamp(1.3rem,2.2vw,1.8rem);color:var(--sky);margin-top:26px;}
  .hero-sub{max-width:560px;margin-top:18px;color:rgba(255,255,255,0.72);font-size:1.02rem;}
  .hero-cta{display:flex;gap:16px;margin-top:40px;flex-wrap:wrap;}

  /* page header (non-home) */
  .page-header{background:var(--navy);color:var(--white);padding:150px 0 70px;}
  .page-header .eyebrow{color:var(--sky);}
  .page-header h1{color:var(--white);font-size:clamp(2.2rem,4.5vw,3.4rem);letter-spacing:-0.01em;}
  .page-header p{color:rgba(255,255,255,0.72);max-width:600px;margin-top:14px;font-size:1.02rem;}

  /* CARDS: activities */
  .cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
  .work-card{border-radius:14px;overflow:hidden;position:relative;min-height:300px;padding:32px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--white);transition:transform .35s ease;}
  .work-card:hover{transform:translateY(-4px);}
  .work-card .bg{position:absolute;inset:0;z-index:0;transition:transform .5s ease;}
  .work-card:hover .bg{transform:scale(1.05);}
  .work-card > *:not(.bg){position:relative;z-index:1;}
  .work-card h3{color:var(--white);font-size:1.5rem;margin-bottom:8px;}
  .work-card p{color:rgba(255,255,255,0.78);font-size:0.92rem;max-width:380px;}
  .work-card .tag{font-size:0.72rem;font-weight:600;color:var(--sky);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:10px;}
  .work-card .cta-arrow{margin-top:18px;font-size:0.85rem;font-weight:600;display:flex;align-items:center;gap:6px;}

  /* PROJECTS */
  .filter-row{display:flex;gap:10px;margin-bottom:36px;flex-wrap:wrap;}
  .filter-chip{padding:9px 18px;border-radius:20px;border:1px solid var(--line);font-size:0.82rem;font-weight:600;color:var(--slate);background:var(--white);}
  .filter-chip.active{background:var(--navy);color:var(--white);border-color:var(--navy);}
  .proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .proj-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--white);transition:box-shadow .3s ease, transform .3s ease;}
  .proj-card:hover{box-shadow:0 18px 40px -22px rgba(10,27,61,0.35);transform:translateY(-3px);}
  .proj-media{height:180px;position:relative;overflow:hidden;background-size:cover;background-position:center;}
  .proj-status{position:absolute;top:14px;left:14px;font-size:0.66rem;font-weight:600;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,0.92);color:var(--navy);text-transform:uppercase;letter-spacing:0.02em;}
  .proj-demo{position:absolute;top:14px;right:14px;font-size:0.62rem;font-weight:600;padding:4px 10px;border-radius:20px;background:rgba(10,27,61,0.55);color:var(--white);}
  .proj-body{padding:20px 22px 24px;}
  .proj-body .cat{font-size:0.72rem;color:var(--royal);font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.02em;}
  .proj-body h4{font-size:1.1rem;color:var(--navy);margin-bottom:8px;font-family:var(--font-display);}
  .proj-body p{font-size:0.85rem;margin-bottom:16px;}
  .section-cta{margin-top:40px;text-align:center;}
  .empty-state{border:1px dashed var(--line);border-radius:14px;padding:60px 30px;text-align:center;color:var(--slate);}

  /* PROJECT DETAIL */
  .detail-hero{position:relative;color:var(--white);padding:180px 0 60px;background-size:cover;background-position:center;}
  .detail-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(10,27,61,0.55), rgba(10,27,61,0.92));}
  .detail-hero .wrap{position:relative;z-index:1;}
  .detail-hero h1{color:var(--white);font-size:clamp(2.2rem,5vw,3.6rem);}
  .detail-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:20px;}
  .detail-meta span{font-size:0.78rem;font-weight:600;padding:7px 14px;border-radius:20px;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.25);}
  .detail-body{max-width:760px;margin:0 auto;padding:70px 28px;}
  .detail-body p{font-size:1.05rem;margin-bottom:20px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:0.85rem;color:var(--sky);margin-bottom:20px;font-weight:600;}

  /* TEAM */
  .team-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;}
  .team-card{aspect-ratio:1/1;border-radius:12px;background:linear-gradient(160deg,#4A1F8F,#1E0B3D 75%);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:12px;background-size:cover;background-position:center;}
  .team-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(10,27,61,0), rgba(10,27,61,0.75));}
  .team-card .meta{position:relative;z-index:1;}
  .team-card .meta b{display:block;color:var(--white);font-size:0.8rem;font-family:var(--font-body);}
  .team-card .meta span{display:block;color:var(--sky);font-size:0.65rem;}
  .teacher-note{margin-top:48px;padding-top:36px;border-top:1px solid var(--line);color:var(--slate);font-size:0.9rem;}
  .teacher-note b{color:var(--navy);}
  @media(max-width:900px){ .team-grid{grid-template-columns:repeat(3,1fr);} .proj-grid,.cards-grid{grid-template-columns:1fr;} }
  @media(max-width:640px){ .team-grid{grid-template-columns:repeat(2,1fr);} }

  /* ORG */
  .org-flow{display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:wrap;margin-top:8px;}
  .org-step{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:18px 26px;text-align:center;min-width:160px;}
  .org-step b{display:block;font-family:var(--font-display);color:var(--navy);font-size:0.95rem;margin-bottom:4px;}
  .org-step span{font-size:0.76rem;color:var(--slate);}
  .org-arrow{color:var(--sky);font-size:1.4rem;padding:0 22px;}
  @media(max-width:640px){ .org-flow{flex-direction:column;} .org-arrow{transform:rotate(90deg);padding:6px 0;} }

  /* CONTACT */
  .contact-section{background:var(--navy);color:var(--white);}
  .contact-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:60px;align-items:center;}
  .contact-section h2, .contact-section h1{color:var(--white);}
  .contact-section .section-head p, .contact-section .page-header p{color:rgba(255,255,255,0.7);}
  .contact-list{display:flex;flex-direction:column;gap:18px;margin-top:10px;}
  .contact-item{display:flex;align-items:center;gap:14px;font-size:1rem;}
  .contact-item svg{width:20px;height:20px;flex:none;color:var(--sky);}
  .contact-item a{color:var(--white);font-weight:500;}
  .contact-item a:hover{color:var(--sky);}
  .ig-block{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:16px;padding:36px;text-align:center;}
  .ig-block h3{color:var(--white);font-size:1.3rem;margin-bottom:10px;}
  .ig-block p{color:rgba(255,255,255,0.65);font-size:0.88rem;margin-bottom:22px;}

  @media(max-width:900px){ .contact-grid{grid-template-columns:1fr;} }

  /* FOOTER */
  footer.site-footer{background:var(--navy);border-top:1px solid rgba(255,255,255,0.12);padding:36px 0;}
  footer.site-footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
  footer.site-footer p{color:rgba(255,255,255,0.5);font-size:0.8rem;}
  footer.site-footer .foot-links{display:flex;gap:20px;flex-wrap:wrap;}
  footer.site-footer .foot-links a{color:rgba(255,255,255,0.6);font-size:0.8rem;}
  footer.site-footer .foot-links a:hover{color:var(--sky);}

  /* ===== ADMIN ===== */
  .admin-bar{background:var(--navy);color:var(--white);padding:16px 0;}
  .admin-bar .wrap{display:flex;justify-content:space-between;align-items:center;}
  .admin-bar .logo-lockup{color:var(--white);}
  .admin-bar-right{display:flex;gap:14px;align-items:center;font-size:0.82rem;}
  .admin-bar-right a{color:rgba(255,255,255,0.75);}
  .admin-bar-right a:hover{color:var(--white);}
  .admin-shell{display:grid;grid-template-columns:220px 1fr;min-height:70vh;}
  .admin-side{border-right:1px solid var(--line);padding:32px 20px;}
  .admin-side a{display:block;padding:11px 14px;border-radius:8px;font-size:0.88rem;font-weight:500;color:var(--navy);margin-bottom:4px;}
  .admin-side a.active{background:var(--ice);color:var(--royal);font-weight:600;}
  .admin-side a:hover{background:var(--ice);}
  .admin-main{padding:40px 40px 80px;}
  .admin-main h2{font-size:1.6rem;margin-bottom:6px;}
  .admin-main > p.sub{color:var(--slate);font-size:0.9rem;margin-bottom:32px;}
  @media(max-width:800px){ .admin-shell{grid-template-columns:1fr;} .admin-side{display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:16px 20px;gap:6px;} .admin-side a{white-space:nowrap;margin-bottom:0;} .admin-main{padding:28px 20px 60px;} }

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:36px;}
  .stat-card{border:1px solid var(--line);border-radius:12px;padding:22px;}
  .stat-card span{display:block;font-family:var(--font-display);font-size:2rem;color:var(--navy);}
  .stat-card small{color:var(--slate);font-size:0.8rem;}
  .quick-actions{display:flex;gap:12px;flex-wrap:wrap;}
  @media(max-width:640px){ .stat-grid{grid-template-columns:1fr;} }

  .login-box{max-width:380px;margin:100px auto;padding:40px;border:1px solid var(--line);border-radius:14px;text-align:center;}
  .login-box h2{margin-bottom:8px;}
  .login-box p{margin-bottom:24px;font-size:0.88rem;}
  .field{margin-bottom:18px;text-align:left;}
  .field label{display:block;font-size:0.8rem;font-weight:600;color:var(--navy);margin-bottom:6px;}
  .field input, .field textarea, .field select{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;font-family:var(--font-body);font-size:0.9rem;color:var(--ink);background:var(--white);}
  .field textarea{resize:vertical;min-height:90px;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:none;border-color:var(--royal);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .hint{font-size:0.76rem;color:var(--slate);margin-top:4px;}

  table.admin-table{width:100%;border-collapse:collapse;margin-bottom:20px;}
  table.admin-table th{text-align:left;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.03em;color:var(--slate);padding:10px 12px;border-bottom:1px solid var(--line);}
  table.admin-table td{padding:12px;border-bottom:1px solid var(--line);font-size:0.88rem;vertical-align:middle;}
  .row-thumb{width:44px;height:44px;border-radius:8px;background:linear-gradient(160deg,#4A1F8F,#1E0B3D);background-size:cover;background-position:center;}
  .badge{font-size:0.68rem;font-weight:600;padding:4px 10px;border-radius:14px;background:var(--ice);color:var(--royal);text-transform:uppercase;}
  .row-actions{display:flex;gap:8px;}
  .icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--white);display:flex;align-items:center;justify-content:center;color:var(--navy);}
  .icon-btn:hover{border-color:var(--royal);color:var(--royal);}
  .icon-btn svg{width:15px;height:15px;}

  .form-card{border:1px solid var(--line);border-radius:14px;padding:28px;margin-bottom:36px;background:var(--ice);}
  .form-card h3{font-size:1.05rem;margin-bottom:18px;}
  .form-actions{display:flex;gap:10px;margin-top:8px;}
  .upload-row{display:flex;align-items:center;gap:14px;}
  .upload-preview{width:64px;height:64px;border-radius:10px;background:var(--sky);background-size:cover;background-position:center;flex:none;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:var(--white);padding:14px 22px;border-radius:30px;font-size:0.85rem;font-weight:500;opacity:0;pointer-events:none;transition:all .3s ease;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

<svg width="0" height="0" style="position:absolute">

      <polygon points="4,52 16,52 16,30 4,36" fill="#1E0B3D"/>

    </g>
    <g id="mark-color-dark">
      <polygon points="4,52 16,52 16,30 4,36" fill="#DAB6FF"/>

      <rect x="4" y="2" width="16" height="20" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>

</svg>

<div id="header-slot"></div>
<main id="page"></main>
<div id="footer-slot"></div>

<script>
/* ================= DATA LAYER ================= */
const STORAGE_KEY = 'eventoData_v1';
const AUTH_KEY = 'eventoAdminAuth';
const ADMIN_PASSWORD = 'evento2026'; // demo-only client-side gate, not real security

function seedData(){
  return {
    content: {
      claim: 'Společně tvoříme víc.',
      heroText: 'Studentská firma, která mění nápady ve skutečné projekty a zážitky.',
      coDelameText: 'EVENTO organizuje soutěže, akce a projekty, které dávají studentskému životu úroveň a řád. Nejsme vázaní na jeden typ akce — propojujeme sport, byznys, výjezdy i školní dění pod jednu značku.',
      contactEmail: 'evento@heroldovysady.cz',
      instagramUrl: ''
    },
    projects: [
      {
        id: 'p1', slug: 'ekonomicka-hra-2026', name: 'Ekonomická hra 2026', category: 'Business',
        status: 'aktualni', demo: true, image: '',
        summary: 'Studentské týmy řídí vlastní virtuální firmy po dobu celého semestru.',
        description: 'Ekonomická hra učí studenty základům podnikání formou simulace — od založení firmy přes marketing až po finanční řízení. Týmy soutěží o nejlepší výsledky v rámci školního roku.',
        order: 1
      },
      {
        id: 'p2', slug: 'lyzarsky-zajezd-2027', name: 'Lyžařský zájezd 2027', category: 'Výjezd',
        status: 'pripravujeme', demo: true, image: '',
        summary: 'Týdenní zimní výjezd pro studenty všech ročníků.',
        description: 'Lyžařský zájezd EVENTO spojuje sport, zážitek a partu. Připravujeme program, ubytování a dopravu tak, aby akce proběhla na profesionální úrovni.',
        order: 2

function getData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ const d = seedData(); localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); return d; }
    return JSON.parse(raw);
  }catch(e){ const d = seedData(); return d; }
}
function saveData(d){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }catch(e){ showToast('Uložení se nezdařilo (úložiště prohlížeče je plné).'); }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');

}

function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function observeReveals(){
  const els = document.querySelectorAll('.reveal:not(.in)');
  if(!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); return; }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  }, {threshold:0.12});
  els.forEach(e=>io.observe(e));
}

      <button class="btn btn-primary" style="width:100%;justify-content:center" id="loginBtn">Přihlásit se</button>
      <p class="hint" style="margin-top:16px">Demo prototyp: jednoduchá ochrana pouze pro účely náhledu, ne produkční zabezpečení.</p>
    </div>`;
    const doLogin = ()=>{
      const val = document.getElementById('adminPass').value;
      if(val === ADMIN_PASSWORD){ sessionStorage.setItem(AUTH_KEY,'1'); go('admin'); }
      else showToast('Nesprávné heslo.');
    };
    document.getElementById('loginBtn').addEventListener('click', doLogin);
    document.getElementById('adminPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
    return;
  }

  document.getElementById('header-slot').innerHTML = `
  <div class="admin-bar"><div class="wrap">
    <a href="#/admin" class="logo-lockup"><svg viewBox="0 0 56 56"><use href="#mark-color-dark"/></svg>evento admin</a>
    <div class="admin-bar-right"><a href="#/">Zobrazit web</a><a href="#" id="logoutLink">Odhlásit se</a></div>
  </div></div>`;
  document.getElementById('logoutLink').addEventListener('click', (e)=>{ e.preventDefault(); sessionStorage.removeItem(AUTH_KEY); go('admin'); });

  const tab = parts[1] || 'dashboard';
  const el = document.getElementById('page');
  el.innerHTML = `
  <div class="admin-shell">
    <div class="admin-side">
      <a href="#/admin" class="${tab==='dashboard'?'active':''}">Dashboard</a>
      <a href="#/admin/projekty" class="${tab==='projekty'?'active':''}">Projekty</a>
      <a href="#/admin/tym" class="${tab==='tym'?'active':''}">Tým</a>
      <a href="#/admin/obsah" class="${tab==='obsah'?'active':''}">Obsah webu</a>
    </div>
    <div class="admin-main" id="adminMain"></div>
  </div>`;
  const main = document.getElementById('adminMain');
  if(tab==='dashboard') main.innerHTML = adminDashboard(data);
  else if(tab==='projekty'){ main.innerHTML = adminProjekty(data); attachAdminProjektyEvents(); }
  else if(tab==='tym'){ main.innerHTML = adminTym(data); attachAdminTymEvents(); }
  else if(tab==='obsah'){ main.innerHTML = adminObsah(data); attachAdminObsahEvents(); }
}

/* --- Projekty --- */
function slugify(s){ return s.toLowerCase().trim()
  .replace(/[áàäâ]/g,'a').replace(/[éěèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úůù]/g,'u')
  .replace(/ý/g,'y').replace(/č/g,'c').replace(/ď/g,'d').replace(/ň/g,'n').replace(/ř/g,'r').replace(/š/g,'s').replace(/ť/g,'t').replace(/ž/g,'z')
  .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

function adminProjekty(data){
  const list = [...data.projects].sort((a,b)=>a.order-b.order);
  return `
  <h2>Projekty</h2>
  <p class="sub">Vytvářejte, upravujte a řaďte projekty zobrazené na webu.</p>
  <button class="btn btn-primary btn-sm" id="newProjectBtn">+ Přidat projekt</button>
  <div id="projectFormSlot" style="margin-top:24px"></div>
  <table class="admin-table" style="margin-top:28px">
    <tr><th></th><th>Název</th><th>Kategorie</th><th>Stav</th><th></th></tr>
    ${list.map((p,i)=>`
    <tr>
      <td><div class="row-thumb" style="${p.image?`background-image:url('${p.image}')`:`background:${gradFor(p.id)}`}"></div></td>
      <td>${esc(p.name)}${p.demo?' <span class="badge">demo</span>':''}</td>
      <td>${esc(p.category)}</td>
      <td><span class="badge">${STATUS_LABEL[p.status]}</span></td>
      <td>
        <div class="row-actions">
          <button class="icon-btn" data-up="${p.id}" title="Nahoru" ${i===0?'disabled':''}>${ICON_UP}</button>
          <button class="icon-btn" data-down="${p.id}" title="Dolů" ${i===list.length-1?'disabled':''}>${ICON_DOWN}</button>
          <button class="icon-btn" data-edit="${p.id}" title="Upravit">${ICON_EDIT}</button>
          <button class="icon-btn" data-del="${p.id}" title="Smazat">${ICON_TRASH}</button>
        </div>
      </td>
    </tr>`).join('')}
  </table>`;
}
function projectFormHtml(p){
  const isEdit = !!p;
  p = p || {id:'', name:'', category:'', status:'aktualni', summary:'', description:'', image:'', demo:false};
  return `
  <div class="form-card">
    <h3>${isEdit?'Upravit projekt':'Nový projekt'}</h3>
    <div class="field-row">
      <div class="field"><label>Název projektu</label><input id="f_name" value="${escAttr(p.name)}"></div>
      <div class="field"><label>Kategorie</label><input id="f_category" value="${escAttr(p.category)}" placeholder="např. Sport, Business, Výjezd"></div>
    </div>
    <div class="field"><label>Stav</label>
      <select id="f_status">
        <option value="aktualni" ${p.status==='aktualni'?'selected':''}>Aktuální</option>
        <option value="pripravujeme" ${p.status==='pripravujeme'?'selected':''}>Připravujeme</option>
        <option value="probehle" ${p.status==='probehle'?'selected':''}>Proběhlé</option>
      </select>
    </div>
    <div class="field"><label>Krátký popis (na kartě)</label><textarea id="f_summary" style="min-height:60px">${escAttr(p.summary)}</textarea></div>
    <div class="field"><label>Detailní popis (na stránce projektu)</label><textarea id="f_description">${escAttr(p.description)}</textarea></div>
    <div class="field">
      <label>Hlavní fotografie</label>
      <div class="upload-row">
        <div class="upload-preview" id="f_preview" style="${p.image?`background-image:url('${p.image}')`:''}"></div>
        <input type="file" id="f_image" accept="image/*">
      </div>
      <div class="hint">Volitelné — bez fotografie se použije brandový barevný podklad.</div>
    </div>
    <div class="field"><label><input type="checkbox" id="f_demo" ${p.demo?'checked':''} style="width:auto;margin-right:8px"> Označit jako demonstrační obsah</label></div>
    <div class="form-actions">
      <button class="btn btn-primary btn-sm" id="saveProjectBtn">Uložit projekt</button>
      <button class="btn btn-outline btn-sm" id="cancelProjectBtn">Zrušit</button>
    </div>
  </div>`;
}
function escAttr(s){ return esc(s); }

function attachAdminProjektyEvents(){
  const data = getData();
  let editingImage = null;

  document.getElementById('newProjectBtn').addEventListener('click', ()=>openProjectForm(null));

  document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{
    const p = data.projects.find(x=>x.id===b.dataset.edit); openProjectForm(p);
  }));
  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('Opravdu smazat tento projekt?')) return;
    const d = getData(); d.projects = d.projects.filter(x=>x.id!==b.dataset.del); saveData(d);
    showToast('Projekt smazán.'); render();
  }));
  document.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click', ()=>moveItem('projects', b.dataset.up, -1)));
  document.querySelectorAll('[data-down]').forEach(b=>b.addEventListener('click', ()=>moveItem('projects', b.dataset.down, 1)));

  function openProjectForm(p){
    editingImage = p ? p.image : '';
    document.getElementById('projectFormSlot').innerHTML = projectFormHtml(p);
    document.getElementById('f_image').addEventListener('change', (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{ editingImage = reader.result; document.getElementById('f_preview').style.backgroundImage = `url('${editingImage}')`; };
      reader.readAsDataURL(file);
    });
    document.getElementById('cancelProjectBtn').addEventListener('click', ()=>{ document.getElementById('projectFormSlot').innerHTML=''; });
    document.getElementById('saveProjectBtn').addEventListener('click', ()=>{
      const name = document.getElementById('f_name').value.trim();
      if(!name){ showToast('Vyplňte název projektu.'); return; }
      const d = getData();
      const payload = {
        name,
        category: document.getElementById('f_category').value.trim() || 'Projekt',
        status: document.getElementById('f_status').value,
        summary: document.getElementById('f_summary').value.trim(),
        description: document.getElementById('f_description').value.trim(),
        image: editingImage || '',
        demo: document.getElementById('f_demo').checked
      };
      if(p && p.id){
        const idx = d.projects.findIndex(x=>x.id===p.id);
        d.projects[idx] = {...d.projects[idx], ...payload};
      } else {
        let slug = slugify(name) || 'projekt';
        let uniqueSlug = slug, n=2;
        while(d.projects.some(x=>x.slug===uniqueSlug)){ uniqueSlug = slug+'-'+n; n++; }
        const maxOrder = d.projects.reduce((m,x)=>Math.max(m,x.order||0),0);
        d.projects.push({id:'p'+Date.now(), slug:uniqueSlug, order:maxOrder+1, ...payload});
      }
      saveData(d);
      showToast('Projekt uložen.');
      go('admin/projekty');
    });
  }
}

function attachAdminTymEvents(){
  const data = getData();
  let editingPhoto = null;
  document.getElementById('newMemberBtn').addEventListener('click', ()=>openMemberForm(null));
  document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{
    const m = data.team.find(x=>x.id===b.dataset.edit); openMemberForm(m);
  }));
  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('Opravdu odstranit tohoto člena?')) return;
    const d = getData(); d.team = d.team.filter(x=>x.id!==b.dataset.del); saveData(d);
    showToast('Člen odstraněn.'); render();
  }));
  document.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click', ()=>moveItem('team', b.dataset.up, -1)));
  document.querySelectorAll('[data-down]').forEach(b=>b.addEventListener('click', ()=>moveItem('team', b.dataset.down, 1)));

  function openMemberForm(m){
    editingPhoto = m ? m.photo : '';
    document.getElementById('memberFormSlot').innerHTML = memberFormHtml(m);
    document.getElementById('m_photo').addEventListener('change', (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{ editingPhoto = reader.result; document.getElementById('m_preview').style.backgroundImage = `url('${editingPhoto}')`; };
      reader.readAsDataURL(file);
    });
    document.getElementById('cancelMemberBtn').addEventListener('click', ()=>{ document.getElementById('memberFormSlot').innerHTML=''; });
    document.getElementById('saveMemberBtn').addEventListener('click', ()=>{
      const name = document.getElementById('m_name').value.trim();
      if(!name){ showToast('Vyplňte jméno.'); return; }
      const d = getData();
      const payload = {
        name,
        position: document.getElementById('m_position').value.trim() || 'Člen týmu',
        note: document.getElementById('m_note').value.trim(),
        photo: editingPhoto || ''
      };
      if(m && m.id){
        const idx = d.team.findIndex(x=>x.id===m.id);
        d.team[idx] = {...d.team[idx], ...payload};
      } else {
        const maxOrder = d.team.reduce((mx,x)=>Math.max(mx,x.order||0),0);
        d.team.push({id:'t'+Date.now(), order:maxOrder+1, ...payload});
      }
      saveData(d);
      showToast('Člen uložen.');
      go('admin/tym');
    });
  }
}

function moveItem(key, id, dir){
  const d = getData();
  const list = [...d[key]].sort((a,b)=>a.order-b.order);
  const idx = list.findIndex(x=>x.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=list.length) return;
  const tmp = list[idx].order; list[idx].order = list[swapIdx].order; list[swapIdx].order = tmp;
  d[key] = list;
  saveData(d);
  render();
}
